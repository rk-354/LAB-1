name: CD — Deploy to Cloudflare Pages (Production)

on:
  push:
    branches: [main]

# NOTE: Full Cloudflare Pages deployment requires all API routes to use
# export const runtime = 'edge'. Routes using pdf-parse, mammoth, xlsx,
# and @anthropic-ai/sdk need edge-compatible rewrites before this works.
# For the demo, the app runs locally. This job documents the target state.

jobs:
  deploy:
    name: Build + Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    environment: production
    continue-on-error: true   # Non-blocking until edge runtime migration complete
    defaults:
      run:
        working-directory: services/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build for Cloudflare Pages
        run: npx @cloudflare/next-on-pages
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NPM_CONFIG_LEGACY_PEER_DEPS: "true"

      - name: Deploy to Cloudflare Pages
        if: success()
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name=refineriq --branch=main
          workingDirectory: services/frontend
